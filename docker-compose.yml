services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mineralvision/api:latest
    environment:
      DATABASE_URL: postgresql://mineralvision:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mineralvision
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost,http://localhost:80
      # WALDO detection service (waldo_proxy.py default is localhost:8001;
      # inside the compose network it is the 'waldo' service on port 8000)
      WALDO_SERVICE_URL: http://waldo:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: mineralvision/ui:latest
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  waldo:
    build:
      context: MineralVision_WALDO_Production_Package
      dockerfile: deployment/cloud/Dockerfile
    image: mineralvision/waldo:latest
    environment:
      MODEL_PRECISION: ${MODEL_PRECISION:-fp16}
      BATCH_SIZE: ${BATCH_SIZE:-4}
      PORT: "8000"
      DATABASE_URI: sqlite:////app/data/waldo_detections.db
    volumes:
      - waldo-models:/app/models
      - waldo-data:/app/data
    ports:
      - "8001:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)" || exit 1
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: mineralvision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: mineralvision
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineralvision -d mineralvision"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  waldo-models:
  waldo-data:
