[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineralvision"
version = "1.0.0"
description = "AI-Powered Mineral Exploration Platform"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12"
authors = [
    {name = "MineralVision Team"}
]
keywords = ["mineral", "exploration", "geospatial", "machine-learning", "digital-twin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.51",
    "alembic==1.19.1",
    "psycopg2-binary==2.9.12",
    "geoalchemy2==0.20.0",
    "PyJWT==2.13.0",
    "bcrypt==5.0.0",
    "numpy==2.5.1",
    "pandas==2.3.3",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "geopandas==1.1.4",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "rasterio==1.5.1",
    "xarray==2026.7.0",
    "matplotlib==3.11.1",
    "plotly==6.9.0",
    "pyarrow==25.0.0",
    "deltalake==1.6.2",
    "duckdb==1.4.4",
    "redis==8.1.0",
    "aiokafka==0.14.0",
    "prometheus-client==0.26.0",
    "structlog==26.1.0",
    "boto3==1.43.67",
    "httpx==0.28.1",
    "aiohttp==3.14.3",
    "requests==2.34.2",
    "laspy==2.7.0",
    "h5py==3.16.0",
    "pyvista==0.48.4",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "optuna==4.9.0",
    "mlflow==3.15.1",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
ml = [
    "torch==2.13.0",
    "ultralytics==8.4.116",
    "pytorch-lightning==2.6.5",
    "transformers==5.14.1",
    "rfdetr==1.9.1",
    "supervision==0.30.0",
    "scikit-image==0.26.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "black==26.5.1",
    "ruff==0.16.2",
    "mypy==2.3.0",
    "locust==2.46.3",
    "bandit==1.9.4",
    "pip-audit==2.10.0",
    "detect-secrets==1.5.0",
]
all = [
    "mineralvision[ml,dev]",
]

[project.scripts]
mineralvision = "mineralvision.cli:main"

[project.urls]
Homepage = "https://mineralvision.io"
Documentation = "https://docs.mineralvision.io"
Repository = "https://github.com/mineralvision/mineralvision"

[tool.setuptools.packages.find]
where = ["."]
include = ["MineralVision_Enhanced*", "MineralVision_Final_Package*", "MineralVision_WALDO*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
exclude = '''
/(
    \.git
    | \.venv
    | node_modules
    | __pycache__
    | \.eggs
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
exclude = ["node_modules", "__pycache__", ".git", ".venv"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
