[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineralvision"
version = "1.0.0"
description = "AI-Powered Mineral Exploration Platform"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "MineralVision Team"}
]
keywords = ["mineral", "exploration", "geospatial", "machine-learning", "digital-twin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.1.0",
    "mlflow>=2.8.0",
    "optuna>=3.4.0",
    "ultralytics>=8.3.0",  # YOLO11 support
]
geo = [
    "rasterio>=1.3.0",
    "pyproj>=3.6.0",
    "xarray>=2023.10.0",
    "laspy>=2.5.0",
]
viz = [
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "pyvista>=0.42.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]
all = [
    "mineralvision[ml,geo,viz,dev]",
]

[project.scripts]
mineralvision = "mineralvision.cli:main"

[project.urls]
Homepage = "https://mineralvision.io"
Documentation = "https://docs.mineralvision.io"
Repository = "https://github.com/mineralvision/mineralvision"

[tool.setuptools.packages.find]
where = ["."]
include = ["MineralVision_Enhanced*", "MineralVision_Final_Package*", "MineralVision_WALDO*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
exclude = '''
/(
    \.git
    | \.venv
    | node_modules
    | __pycache__
    | \.eggs
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
exclude = ["node_modules", "__pycache__", ".git", ".venv"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
