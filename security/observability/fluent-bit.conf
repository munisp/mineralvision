# MineralVision local log-forwarder configuration.
# Docker sends each service's stdout/stderr to this local Forward input using a
# service-specific tag. The external collector is defined by protected runtime
# variables; do not add SIEM credentials to this repository.

[SERVICE]
    Flush                 1
    Grace                 30
    Log_Level             info
    Parsers_File          parsers.conf
    storage.path          /fluent-bit/state
    storage.sync          normal
    storage.checksum      on
    storage.backlog.mem_limit 64M

[INPUT]
    Name                  forward
    Listen                0.0.0.0
    Port                  24224
    Shared_Key            ${SIEM_FORWARD_SHARED_KEY}
    storage.type          filesystem

# Some OpenAppSec releases emit WAF events primarily into the agent log volume.
# Tail that volume without attempting to parse or retain raw request bodies.
[INPUT]
    Name                  tail
    Path                  /var/log/nano_agent/*.log
    Tag                   mineralvision.appsec-file
    Read_from_Head        Off
    Skip_Long_Lines       On
    DB                    /fluent-bit/state/appsec-tail.db
    storage.type          filesystem

# Preserve the Docker driver tag, e.g. mineralvision.caddy or
# mineralvision.appsec-agent. The SIEM should index this field as source.service.
[FILTER]
    Name                  modify
    Match                 mineralvision.*
    Add                   platform mineralvision
    Add                   environment ${ENV}

# Forward only over verified TLS to a privately reachable external collector.
# The Forward shared key protects the Fluent Bit protocol handshake; network
# ACLs/VPN and the CA pin protect the transport path.
[OUTPUT]
    Name                  forward
    Match                 mineralvision.*
    Host                  ${SIEM_FORWARD_HOST}
    Port                  ${SIEM_FORWARD_PORT}
    Shared_Key            ${SIEM_FORWARD_SHARED_KEY}
    tls                   on
    tls.verify            on
    tls.ca_file           /fluent-bit/certs/siem-ca.pem
    net.keepalive         on
    net.keepalive_idle_timeout 30
    Retry_Limit           False
