# Based on the OpenAppSec declarative preventive policy structure.
# Validate this file with the exact pinned OpenAppSec release before production use.
# Begin in detect-learn in staging, review false positives, then promote to prevent-learn.
policies:
  default:
    triggers:
      - appsec-default-log-trigger
    mode: prevent-learn
    practices:
      - webapp-default-practice
    custom-response: appsec-default-web-user-response
    specific-rules: []

practices:
  - name: webapp-default-practice
    openapi-schema-validation:
      configmap: []
      override-mode: prevent-learn
    snort-signatures:
      configmap: []
      override-mode: prevent-learn
    web-attacks:
      max-body-size-kb: 25600
      max-header-size-bytes: 32768
      max-object-depth: 32
      max-url-size-bytes: 8192
      minimum-confidence: high
      override-mode: prevent-learn
    protections:
      csrf-protection: inactive
      error-disclosure: inactive
      non-valid-http-methods: true
      open-redirect: inactive
      anti-bot:
        injected-URIs: []
        validated-URIs: []
        override-mode: prevent-learn

log-triggers:
  - name: appsec-default-log-trigger
    access-control-logging:
      allow-events: false
      drop-events: true
    additional-suspicious-events-logging:
      enabled: true
      minimum-severity: high
    response-body: false
    appsec-logging:
      all-web-requests: false
      detect-events: true
      prevent-events: true
      extended-logging:
        # Avoid copying credentials and raw imagery into WAF logs.
        http-headers: false
        request-body: false
        url-path: false
        url-query: false
      log-destination:
        cloud: false
        stdout:
          format: json

custom-responses:
  - name: appsec-default-web-user-response
    mode: response-code-only
    http-response-code: 403
