# Include this fragment from the PostgreSQL server configuration after installing
# pgBackRest in the database image. Restart PostgreSQL after changing wal_level or
# archive_mode. Test archive_command with pgbackrest check before trusting backups.
wal_level = replica
archive_mode = on
archive_timeout = '60s'
archive_command = 'pgbackrest --stanza=mineralvision archive-push %p'
max_wal_senders = 5
wal_compression = on
