apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcgis-integration
  labels:
    app: arcgis-integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arcgis-integration
  template:
    metadata:
      labels:
        app: arcgis-integration
    spec:
      containers:
      - name: arcgis-integration
        image: mineralvision/arcgis-integration:latest
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
        env:
        - name: DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: waldo-secrets
              key: database-uri
        - name: ARCGIS_URL
          valueFrom:
            secretKeyRef:
              name: waldo-secrets
              key: arcgis-url
        - name: ARCGIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: waldo-secrets
              key: arcgis-username
        - name: ARCGIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: waldo-secrets
              key: arcgis-password
