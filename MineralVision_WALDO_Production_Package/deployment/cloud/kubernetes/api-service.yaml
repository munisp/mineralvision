apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app: api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
      - name: api-service
        image: mineralvision/waldo-api:latest
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
        env:
        - name: DATABASE_URI
          valueFrom:
            secretKeyRef:
              name: waldo-secrets
              key: database-uri
        - name: RABBITMQ_URI
          valueFrom:
            secretKeyRef:
              name: waldo-secrets
              key: rabbitmq-uri
        - name: WALDO_SERVICE_URL
          value: "http://waldo-detection:8000"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api-service
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
