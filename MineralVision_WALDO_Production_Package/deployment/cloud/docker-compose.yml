services:
  # WALDO Detection Service (GPU)
  waldo-detection:
    image: mineralvision/waldo-detection:latest
    build:
      context: ../../
      dockerfile: deployment/cloud/Dockerfile
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_PRECISION=fp16
      - BATCH_SIZE=4
      - PORT=8000
      - DATABASE_URI=postgresql://mineralvision:${DB_PASSWORD}@database:5432/waldo_detections
      - RABBITMQ_URI=amqp://mineralvision:${RABBITMQ_PASSWORD}@message-broker:5672/
    volumes:
      - waldo-models:/app/models
      - waldo-data:/app/data
    ports:
      - "8001:8000"
    depends_on:
      database:
        condition: service_healthy
      message-broker:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Platform API (root Dockerfile; FastAPI at MineralVision_Final_Package)
  api:
    image: mineralvision/api:latest
    build:
      context: ../../../
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://mineralvision:${DB_PASSWORD}@database:5432/waldo_detections
      - WALDO_SERVICE_URL=http://waldo-detection:8000
    depends_on:
      - waldo-detection
      - database

  # Web UI (root Dockerfile.ui; nginx proxies /api -> api:8000)
  ui:
    image: mineralvision/ui:latest
    build:
      context: ../../../
      dockerfile: Dockerfile.ui
    ports:
      - "80:80"
    depends_on:
      - api

  # Database
  database:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=mineralvision
      - POSTGRES_DB=waldo_detections
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineralvision -d waldo_detections"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker
  message-broker:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=mineralvision
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  waldo-models:
  waldo-data:
  postgres-data:
  rabbitmq-data:
