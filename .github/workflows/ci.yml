name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (enforced on test suites)
        run: ruff check tests MineralVision_Enhanced/lakehouse_architecture/tests
      - name: Ruff check (full repository, informational)
        # The legacy package dirs carry ~33k pre-existing lint findings; reported
        # here without failing the build until the codebase is cleaned up.
        continue-on-error: true
        run: ruff check MineralVision_Enhanced MineralVision_Final_Package MineralVision_WALDO_Production_Package tests

  compile:
    name: Byte-compile sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python sources
        run: >-
          python -m compileall -q
          -x '(^|/)(\.venv|node_modules|dist|__pycache__)/'
          MineralVision_Enhanced MineralVision_Final_Package
          MineralVision_WALDO_Production_Package tests scripts

  test:
    name: Pytest with coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run test suite
        run: >-
          pytest tests/ MineralVision_Enhanced/lakehouse_architecture/tests/
          --cov --cov-fail-under=40 -v

  docker:
    name: Docker build check (API image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile .
