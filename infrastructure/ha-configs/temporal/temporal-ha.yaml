    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - history
                topologyKey: kubernetes.io/hostname
      containers:
        - name: temporal-history
          image: temporalio/server:1.22.0
          env:
            - name: SERVICES
              value: history
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: temporal-secrets
                  key: postgres-user
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-secrets
                  key: postgres-password
          ports:
            - containerPort: 7234
              name: grpc
            - containerPort: 6934
              name: membership
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - name: config
              mountPath: /etc/temporal/config/config_template.yaml
              subPath: config_template.yaml
      volumes:
        - name: config
          configMap:
            name: temporal-config
---
