apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "mineralvision"
          serviceAccountRef:
            name: "mineralvision"
            namespace: "mineralvision"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-secrets
  namespace: mineralvision
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: kafka-secrets
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: kafka/credentials
        property: username
    - secretKey: password
      remoteRef:
        key: kafka/credentials
        property: password
---
