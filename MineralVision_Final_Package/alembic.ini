# Alembic configuration for the MineralVision API database.
# Run from this directory (MineralVision_Final_Package/):
#   alembic upgrade head
# The database URL comes from (in priority order):
#   1. -x dburl=... / sqlalchemy.url set programmatically
#   2. DATABASE_URL environment variable (Postgres DSN in production)
#   3. sqlite:///./mineralvision.db (development fallback)

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally unset here; alembic/env.py resolves it
# from DATABASE_URL so credentials never live in this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
